# Счётчики: общая секция инспектора, не профиля.
#
# Счётчик -- семейство корзин, по одной на пару (ось, субъект). Профили
# ссылаются на счётчики по имени; ссылка на необъявленное отвергает поколение
# целиком. Ключи Redis без профиля -- cnt:bkt:<счётчик>:<ось>:<субъект>, --
# поэтому маршруты с разными профилями греют один счёт: «получил много
# объектов» -- факт про субъекта, а не про маршрут.
#
# У оси два числа: max -- ёмкость в натуральных единицах счётчика (вхождения,
# килобайты, запросы), loss -- потери в процентах ёмкости в секунду. Тихий
# субъект возвращается к нулю за 100/loss секунд. Пороги профилей пишутся в
# процентах заполнения: натуральные единицы у каждого счётчика свои, а процент
# читается одинаково у всех.

counters:
  # Сколько объектов приложения субъект получил в ответах. Чем наполнять,
  # решают правила measure профилей (regex по телу ответа).
  api_objects:
    unit: obj
    axes:
      ip:         { max: 1000,  loss: 2 }    # ноль за ~50 секунд
      asn_net:    { max: 5000,  loss: 2 }
      sess:       { max: 800,   loss: 2 }

  # Сколько килобайт JSON субъект унёс. size_kb берётся из локатора: полный
  # размер, даже когда тело обрезано превью.
  json_kb:
    unit: kb
    axes:
      ip:         { max: 51200, loss: 5 }    # 50 МБ ёмкости
      asn_net:    { max: 262144, loss: 5 }

  # Служебный счётчик пробы: правило _probe с порогом 0 срабатывает на пустой
  # корзине, и healthcheck не зависит ни от Redis, ни от трафика.
  probe:
    axes:
      ip:         { max: 1, loss: 100 }

  # Стендовый счётчик прогона tests/counter: ёмкость мала намеренно, чтобы
  # порог брался парой запросов, а потери малы, чтобы уровень не утёк между
  # шагами прогона. Тихий адрес остывает за 100 секунд.
  stand_objects:
    unit: obj
    axes:
      ip:         { max: 20, loss: 1 }
      sess:       { max: 20, loss: 1 }

  # Сигнальная корзина того же прогона: наполняют соседи просьбами note
  # (проценты ёмкости, минус снимает, -100 обнуляет), правила measure в неё
  # целиться не могут -- владелец у шкалы один. Числа те же, что у
  # stand_objects, и по той же причине.
  stand_abuse:
    unit: pts
    fill: note
    axes:
      ip:         { max: 20, loss: 1 }

  # Тот же прогон, ось «пользователь» по личности: ключ -- логин, который
  # назвала калитка (секция sessions сообщения модуля), а не кука клиента.
  # Ёмкость два: второе сообщение доливает корзину до потолка, и следующий
  # запрос этого человека получает отказ -- с любого адреса и устройства.
  stand_people:
    unit: obj
    axes:
      user:       { max: 2, loss: 1 }
    subjects:
      user: { from: "session:user" }

  # Стенд кадров (nginx/tests/ws, профиль ws): кадры клиента по соединению.
  # Ёмкость пять кадров, потери большие: шестой кадр подряд доливает корзину
  # за порог, а пауза в секунду остужает её.
  ws_frames:
    unit: frm
    axes:
      conn:       { max: 5, loss: 50 }

  # Байты приложения по адресу: учёт стороны s2c, суда над ним на стенде нет.
  ws_bytes:
    unit: b
    axes:
      ip:         { max: 1048576, loss: 10 }

  # Стенд кадров, профиль ws_quota: две корзины на кадры клиента. Первая --
  # по соединению, мала: с третьего кадра подряд счётчик просит rewrite
  # отвечать сообщением об ошибке (do: mutate). Вторая -- по адресу, чуть
  # больше: шестой кадр кладёт адрес в набор blocklist, и локальный слой
  # закрывает сессию, а следующее рукопожатие отказывает. Потери большие:
  # пауза в секунды остужает обе.
  ws_err:
    unit: frm
    axes:
      conn:       { max: 3, loss: 50 }
  ws_ban:
    unit: frm
    axes:
      ip:         { max: 6, loss: 50 }

  # Нагрузка на ту же лестницу (load.mjs, профиль ws_ladder): те же две
  # корзины, но ёмкость неприличная -- порог под прогоном не берётся, и
  # меряется цена пути, а не срабатывание.
  ws_err_load:
    unit: frm
    axes:
      conn:       { max: 50000000, loss: 1 }
  ws_ban_load:
    unit: frm
    axes:
      ip:         { max: 500000000, loss: 1 }

  # Нагрузочный прогон кадров (nginx/tests/ws/load.mjs, профиль wsload): вход
  # и выход как у боевого чата. Ёмкость и потери такие, что честный клиент
  # порога не берёт: 5000 кадров по соединению остывают на 1000/с, 256 МБ
  # выдачи по адресу -- на 50 МБ/с. Порог 100 % -- флуд, не нагрузка.
  ws_in:
    unit: frm
    axes:
      conn:       { max: 5000, loss: 20 }
  ws_out:
    unit: b
    axes:
      ip:         { max: 268435456, loss: 20 }

# Откуда берутся ключи настраиваемых осей. sess по умолчанию читает куку
# клиренса капчи (подпись не проверяется: нужен стабильный ключ, а не
# доказательство). user выключена, пока не назван источник:
#   from: "cookie:<имя>" | "header:<имя>" -- то, что прислал клиент,
#   from: "session:user" | "session:sid"  -- личность от калитки.
# Общий источник пуст: единственный счётчик с этой осью (stand_people) назвал
# свой прямо в объявлении.
subjects:
  sess:
    cookie: waf_cid
  user:
    from: ""
